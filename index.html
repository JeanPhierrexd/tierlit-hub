
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b12">
  <title>Tierlit Hub</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0b12;
      color: #f6f5ff;
      font-family: system-ui, Arial, sans-serif;
    }

    header {
      max-width: 1100px;
      margin: auto;
      padding: 24px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .logo {
      font-size: 27px;
      font-weight: 850;
      letter-spacing: -1px;
    }

    .logo span, .accent { color: #a78bfa; }

    main {
      max-width: 1100px;
      margin: 25px auto;
      padding: 0 20px;
    }

    .tag {
      color: #b9a5ff;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    h1 {
      margin: 12px 0;
      font-size: clamp(35px, 6vw, 58px);
      line-height: 1.1;
      letter-spacing: -2px;
    }

    h2 { margin-top: 30px; }

    .muted {
      color: #aaa9bd;
      line-height: 1.6;
    }

    .panel {
      padding: 22px;
      margin: 20px 0;
      border: 1px solid #29283a;
      border-radius: 20px;
      background: #14141f;
    }

    input, button {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      font: inherit;
    }

    input {
      color: white;
      background: #0e0e17;
      border: 1px solid #343247;
      outline: none;
    }

    input:focus { border-color: #a78bfa; }

    button {
      border: 0;
      cursor: pointer;
      font-weight: 750;
    }

    button:disabled {
      opacity: .55;
      cursor: wait;
    }

    .primary {
      color: #171025;
      background: #a78bfa;
    }

    .secondary {
      color: white;
      background: #29283a;
    }

    .danger {
      margin-top: 10px;
      padding: 9px 12px;
      color: #ffb5c1;
      background: #30202a;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .row > * { flex: 1 1 180px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .card {
      min-width: 0;
      padding: 20px;
      overflow-wrap: anywhere;
      border: 1px solid #302e43;
      border-radius: 18px;
      background: linear-gradient(145deg, #191927, #11111a);
    }

    .card-icon {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      margin-bottom: 18px;
      border-radius: 14px;
      background: #29243d;
      font-size: 23px;
    }

    .card h3 { margin: 0 0 8px; }

    .card p {
      color: #aaa9bd;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .card a {
      display: block;
      margin-top: 16px;
      padding: 11px;
      border-radius: 10px;
      color: #e6dcff;
      background: #28243a;
      text-decoration: none;
      text-align: center;
      font-weight: 750;
    }

    .card a:hover { background: #393052; }

    .add-card {
      border: 1px dashed #75639f;
      background: linear-gradient(145deg, #191626, #11111a);
    }

    .add-card .card-icon {
      color: #c4b5fd;
      font-size: 28px;
    }

    .add-card form {
      display: grid;
      gap: 10px;
      margin-top: 15px;
    }

    .hidden { display: none !important; }

    .section-title {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .status {
      color: #b9a5ff;
      font-size: 13px;
    }

    footer {
      padding: 30px 15px;
      color: #77768b;
      text-align: center;
      font-size: 12px;
    }

    @media (max-width: 750px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 460px) {
      .grid { grid-template-columns: 1fr; }
      .row { flex-direction: column; }
      .row > * { flex-basis: auto; }
      h1 { letter-spacing: -1px; }
      main { margin-top: 15px; }
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">Tierlit<span>Hub</span></div>
    <button id="logout" class="secondary hidden"
            style="width:auto" type="button">
      Cerrar sesión
    </button>
  </header>

  <main>
    <section style="margin-bottom:30px">
      <div class="tag">TU ESPACIO DIGITAL</div>
      <h1>Todo lo tuyo.<br><span class="accent">En un solo lugar.</span></h1>
      <p class="muted">Tus páginas favoritas, organizadas a tu manera.</p>
    </section>

    <section id="auth" class="panel">
      <h2 style="margin-top:0">Tu cuenta</h2>
      <p class="muted">Inicia sesión o crea tu cuenta para guardar tus enlaces.</p>

      <form id="auth-form">
        <div style="margin-bottom:12px">
          <input id="email" type="email" placeholder="Correo electrónico"
                 autocomplete="email" required>
        </div>
        <div style="margin-bottom:12px">
          <input id="password" type="password"
                 placeholder="Contraseña (mínimo 6 caracteres)"
                 minlength="6" autocomplete="current-password" required>
        </div>
        <div class="row">
          <button class="primary" id="login-btn" type="submit">
            Iniciar sesión
          </button>
          <button class="secondary" id="signup-btn" type="button">
            Crear cuenta
          </button>
        </div>
      </form>
      <p id="auth-message" class="muted" role="status"></p>
    </section>

    <section id="app" class="hidden">
      <div class="section-title">
        <div>
          <h2 style="margin-top:0">Mis páginas</h2>
          <p class="muted">Tus páginas favoritas en un solo lugar.</p>
        </div>
        <span id="status" class="status">Conectando...</span>
      </div>

      <div id="links-grid" class="grid"></div>
      <p id="link-message" class="muted" role="status"></p>
    </section>
  </main>

  <footer>Tierlit Hub · Tu mundo, tus enlaces.</footer>

  <script>
    const SUPABASE_URL = "https://lblowkukvpwxdqanvapd.supabase.co";
    const SUPABASE_KEY = "sb_publishable_F2jow9jKpHsibwQ8qkb6pw_aTLhuHeZ";

    const $ = id => document.getElementById(id);

    let client = null;
    let currentUser = null;
    let savedLinks = [];
    let busy = false;

    const defaults = [
      {
        title: "AULA Hub",
        url: "https://hub.aulacn.com/home",
        icon: "⌨️"
      },
      {
        title: "ATK Hub",
        url: "https://hub.atk.pro/",
        icon: "🎮"
      },
      {
        title: "Canva",
        url: "https://www.canva.com/",
        icon: "🎨"
      }
    ];

    function safeUrl(value) {
      try {
        const u = new URL(value);
        return ["https:", "http:"].includes(u.protocol) ? u.href : null;
      } catch {
        return null;
      }
    }

    function makeCard(item, removable = false) {
      const card = document.createElement("article");
      card.className = "card";

      const icon = document.createElement("div");
      icon.className = "card-icon";
      icon.textContent = item.icon || "↗";

      const title = document.createElement("h3");
      title.textContent = item.title;

      const urlText = document.createElement("p");
      urlText.textContent = item.url;

      const link = document.createElement("a");
      link.href = safeUrl(item.url) || "#";
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = "Abrir página ↗";

      card.append(icon, title, urlText, link);

      if (removable) {
        const del = document.createElement("button");
        del.className = "danger";
        del.type = "button";
        del.textContent = "Eliminar";
        del.addEventListener("click", () => deleteLink(item.id));
        card.append(del);
      }

      return card;
    }

    function makeAddCard() {
      const card = document.createElement("article");
      card.className = "card add-card";

      const icon = document.createElement("div");
      icon.className = "card-icon";
      icon.textContent = "+";

      const title = document.createElement("h3");
      title.textContent = "Añadir web";

      const description = document.createElement("p");
      description.textContent = "Guarda una nueva página en tu colección.";

      const form = document.createElement("form");
      form.id = "add-form";

      const name = document.createElement("input");
      name.id = "new-title";
      name.placeholder = "Nombre de la página";
      name.maxLength = 60;
      name.required = true;

      const url = document.createElement("input");
      url.id = "new-url";
      url.type = "url";
      url.placeholder = "https://...";
      url.required = true;

      const button = document.createElement("button");
      button.className = "primary";
      button.type = "submit";
      button.textContent = "＋ Añadir enlace";

      form.append(name, url, button);
      card.append(icon, title, description, form);

      form.addEventListener("submit", addLink);
      return card;
    }

    function renderLinks() {
      const grid = $("links-grid");
      grid.replaceChildren();

      // 1. Accesos rápidos fijos.
      defaults.forEach(item => grid.append(makeCard(item)));

      // 2. Enlaces guardados, con los más recientes primero.
      savedLinks.forEach(item => grid.append(makeCard(item, true)));

      // 3. La tarjeta para añadir webs SIEMPRE queda al final.
      grid.append(makeAddCard());
    }

    function showApp(user) {
      currentUser = user;

      $("auth").classList.toggle("hidden", !!user);
      $("app").classList.toggle("hidden", !user);
      $("logout").classList.toggle("hidden", !user);

      if (user) {
        loadLinks();
      } else {
        savedLinks = [];
        $("links-grid").replaceChildren();
        $("status").textContent = "Sin iniciar sesión";
      }
    }

    $("auth-form").addEventListener("submit", async event => {
      event.preventDefault();
      if (!client || busy) return;

      busy = true;
      $("login-btn").disabled = true;
      $("signup-btn").disabled = true;
      $("auth-message").textContent = "Iniciando sesión...";

      try {
        const { data, error } = await client.auth.signInWithPassword({
          email: $("email").value.trim(),
          password: $("password").value
        });

        if (error) throw error;

        $("auth-message").textContent = "Sesión iniciada correctamente.";
        showApp(data.user);
      } catch (error) {
        $("auth-message").textContent = "Error: " + error.message;
      } finally {
        busy = false;
        $("login-btn").disabled = false;
        $("signup-btn").disabled = false;
      }
    });

    $("signup-btn").addEventListener("click", async () => {
      if (!client || busy) return;

      const email = $("email").value.trim();
      const password = $("password").value;

      if (!email || password.length < 6) {
        $("auth-message").textContent =
          "Escribe tu correo y una contraseña de al menos 6 caracteres.";
        return;
      }

      busy = true;
      $("signup-btn").disabled = true;
      $("login-btn").disabled = true;
      $("auth-message").textContent = "Creando tu cuenta...";

      try {
        const { data, error } = await client.auth.signUp({
          email,
          password,
          options: { emailRedirectTo: window.location.origin }
        });

        if (error) throw error;

        if (data.session) {
          $("auth-message").textContent = "¡Cuenta creada!";
          showApp(data.user);
        } else {
          $("auth-message").textContent =
            "Revisa tu correo para confirmar tu cuenta y luego inicia sesión.";
        }
      } catch (error) {
        $("auth-message").textContent = "Error: " + error.message;
      } finally {
        busy = false;
        $("signup-btn").disabled = false;
        $("login-btn").disabled = false;
      }
    });

    $("logout").addEventListener("click", async () => {
      if (!client) return;

      const { error } = await client.auth.signOut();

      if (error) {
        $("auth-message").textContent = "Error al cerrar sesión: " + error.message;
        return;
      }

      showApp(null);
      $("auth-message").textContent = "Has cerrado sesión.";
    });

    async function loadLinks() {
      if (!client || !currentUser) return;

      const userId = currentUser.id;
      $("status").textContent = "Cargando...";

      const { data, error } = await client
        .from("links")
        .select("id,title,url,created_at")
        .order("created_at", { ascending: false });

      if (!currentUser || currentUser.id !== userId) return;

      if (error) {
        $("status").textContent = "Error al cargar";
        $("link-message").textContent = "No se pudieron cargar los enlaces: " + error.message;
        return;
      }

      savedLinks = data || [];
      $("status").textContent = "Sincronizado ✓";
      renderLinks();
    }

    async function addLink(event) {
      event.preventDefault();
      if (!client || !currentUser || busy) return;

      const title = $("new-title").value.trim();
      const url = safeUrl($("new-url").value.trim());

      if (!title || !url) {
        $("link-message").textContent = "Escribe un nombre y una URL válida.";
        return;
      }

      const button = event.currentTarget.querySelector("button");
      busy = true;
      button.disabled = true;
      button.textContent = "Guardando...";

      try {
        const { error } = await client.from("links").insert({
          user_id: currentUser.id,
          title,
          url
        });

        if (error) throw error;

        $("link-message").textContent = "¡Enlace guardado correctamente! ✓";
        await loadLinks();
      } catch (error) {
        $("link-message").textContent = "No se pudo guardar: " + error.message;
      } finally {
        busy = false;
        if (button.isConnected) {
          button.disabled = false;
          button.textContent = "＋ Añadir enlace";
        }
      }
    }

    async function deleteLink(id) {
      if (!client || !currentUser || busy) return;
      if (!confirm("¿Quieres eliminar este enlace?")) return;

      busy = true;

      try {
        const { error } = await client
          .from("links")
          .delete()
          .eq("id", id);

        if (error) throw error;

        $("link-message").textContent = "Enlace eliminado.";
        await loadLinks();
      } catch (error) {
        $("link-message").textContent = "No se pudo eliminar: " + error.message;
      } finally {
        busy = false;
      }
    }

    async function init() {
      try {
        if (!window.supabase) {
          throw new Error("No se pudo cargar Supabase. Recarga la página.");
        }

        client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const { data, error } = await client.auth.getSession();
        if (error) throw error;

        showApp(data.session ? data.session.user : null);

        client.auth.onAuthStateChange((_event, session) => {
          showApp(session ? session.user : null);
        });
      } catch (error) {
        $("auth-message").textContent = "Error de conexión: " + error.message;
      }
    }

    init();
  </script>
</body>
          </html>
